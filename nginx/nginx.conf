events {}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;

    # Fait re-résoudre les noms des services Docker (évite les "No route to host" après redémarrage)
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Catch-all : tout Host inconnu -> on coupe net
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Ton site par IP publique
    server {
        listen 80;
        server_name 46.62.128.138;

        # Ne jamais servir les dotfiles (.env, .git, etc.)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /static/ {
            alias /app/staticfiles/;
            autoindex off;
        }

        location / {
            # Proxy vers le service Docker "django" sur son port interne 8080
            set $django_upstream http://django:8080;
            proxy_pass $django_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }
    }
}
